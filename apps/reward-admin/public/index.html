<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoopTodo 奖励管理</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#171717}main{max-width:1080px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px}input,select,textarea,button{box-sizing:border-box;width:100%;margin-top:8px;padding:10px;border-radius:9px;border:1px solid #d1d5db}button{background:#2563eb;color:white;border:0;font-weight:650;cursor:pointer}.secondary{background:#52525b}.danger{background:#b91c1c}.row{display:flex;gap:8px}.row>*{flex:1}.item{padding:10px 0;border-top:1px solid #eee;word-break:break-word}.muted{color:#6b7280;font-size:13px}pre{white-space:pre-wrap}</style></head>
<body><main><h1>LoopTodo 奖励管理</h1><p class="muted">独立运营页面。使用管理员账号登录后取得 Access Token，再连接管理员 API。</p>
<section class="card"><label>API 地址<input id="api" value="http://127.0.0.1:3000"></label><label>管理员 Access Token<textarea id="token" rows="3"></textarea></label><button id="refresh">刷新奖励与发放记录</button><pre id="message"></pre></section>
<div class="grid"><section class="card"><h2>上架奖励</h2><input id="name" placeholder="奖励名称"><textarea id="description" placeholder="奖励说明"></textarea><select id="type"><option value="virtual">虚拟奖励</option><option value="physical">实物奖励</option></select><input id="inventory" type="number" min="0" placeholder="库存（留空为不限）"><button id="create">上架</button><div id="rewards"></div></section>
<section class="card"><h2>发放奖励</h2><input id="rewardId" placeholder="奖励 ID"><input id="userId" placeholder="用户 UUID"><button id="grant">发放</button><h2>待履约记录</h2><div id="claims"></div></section></div></main>
<script>
const $=id=>document.getElementById(id); const message=$('message');
async function request(path,init={}){const response=await fetch($('api').value.replace(/\/$/,'')+path,{...init,headers:{'content-type':'application/json',authorization:'Bearer '+$('token').value.trim(),...(init.headers||{})}});const body=await response.json();if(!response.ok)throw new Error(body.error?.message||body.error?.code||'请求失败');return body.data}
async function refresh(){try{const [rewards,claims]=await Promise.all([request('/rewards'),request('/admin/reward-claims')]);$('rewards').innerHTML=rewards.map(x=>`<div class="item"><b>${x.name}</b><div class="muted">${x.id} · ${x.rewardType} · 库存 ${x.inventory??'不限'}</div></div>`).join('')||'<p class="muted">暂无奖励</p>';$('claims').innerHTML=claims.map(x=>`<div class="item"><b>${x.reward.name}</b><div class="muted">${x.id} · ${x.status} · ${x.user.nickname}</div><div class="row"><button onclick="fulfillment('${x.id}')">查看地址</button><button class="secondary" onclick="fulfill('${x.id}')">确认履约</button></div></div>`).join('')||'<p class="muted">暂无发放记录</p>';message.textContent='已刷新'}catch(e){message.textContent=e.message}}
async function fulfillment(id){try{message.textContent=JSON.stringify(await request('/admin/reward-claims/'+id+'/fulfillment'),null,2)}catch(e){message.textContent=e.message}}
async function fulfill(id){try{await request('/admin/reward-claims/'+id+'/fulfill',{method:'POST'});await refresh()}catch(e){message.textContent=e.message}}
$('refresh').onclick=refresh;$('create').onclick=async()=>{try{const inventory=$('inventory').value;await request('/admin/rewards',{method:'POST',body:JSON.stringify({name:$('name').value,description:$('description').value,rewardType:$('type').value,inventory:inventory?Number(inventory):undefined})});await refresh()}catch(e){message.textContent=e.message}};$('grant').onclick=async()=>{try{await request('/admin/rewards/'+$('rewardId').value.trim()+'/claims',{method:'POST',body:JSON.stringify({userId:$('userId').value.trim()})});await refresh()}catch(e){message.textContent=e.message}};
</script></body></html>
