feature: 2026-07-11-mobile-foundation
created: 2026-07-11

steps:
  - id: S1
    action: "按设计 2.5 做行为不变的 App.tsx 拆文件微重构"
    exit_signal: "TypeScript 与 Android export 通过，现有可见文案和交互入口未减少"
    status: done
  - id: S2
    action: "建立 Expo Router App Shell 和首页 Route Screen"
    exit_signal: "expo-router/entry 可构建，首页路由测试与 Android export 通过"
