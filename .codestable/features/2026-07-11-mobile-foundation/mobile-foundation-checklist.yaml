    status: done
  - id: S5
    action: "清理旧入口和死代码并运行全量验证"
    exit_signal: "typecheck、测试、Android export、diff check 全部通过且无范围外实现"
    status: done

checks:
  - item: "Route Screen 只编排模块，不直接维护领域状态"
    source: 编排骨架
    status: passed
  - item: "TaskRepository 包含 list/create/save/finishSession 契约，结束操作原子写任务与记录"
    source: 名词契约
    status: passed
  - item: "Task 与 FocusSessionRecord 使用 string ID，store actions 明确返回 Promise"
    source: 名词契约
    status: passed
  - item: "完成和退出同一会话最多写一条记录"
    source: 流程级约束
    status: passed
  - item: "锁机能力未实现时仍拒绝启动"
    source: 范围守护
    status: passed
  - item: "不实现 SQLite schema、同步和后端请求"
    source: 范围守护
    status: passed
  - item: "Router 冷启动进入首页"
    source: 验收场景
    status: passed
  - item: "空标题不创建任务"
    source: 验收场景
    status: passed
  - item: "点击任务后会话绑定该任务"
    source: 验收场景
    status: passed
  - item: "repository 错误进入显式 error state"
    source: 验收场景
    status: passed

dod:
  commands:
    - id: CMD-001
      command: "npm run typecheck"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "npm test -- --runInBand"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "npx expo export --platform android --output-dir .expo-export-check --clear"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, diff_summary, test_results]
  cleanliness:
    debug_output: forbidden
